name: 📊 Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Generate 3D Contribution Graph
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📊 Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Pradum9754

      - name: 🚀 Commit & Push Profile 3D
        run: |
          git config --global user.email "pradumprajapati482@gmail.com"
          git config --global user.name "Pradum Prajapati"
          git add -A
          git commit -m "chore: auto-update 3D contribution calendar [skip ci]" || true
          git push
